services:
  # Express API
  - type: web
    name: sport-team-portal-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: MONGODB_DB_NAME
        value: sports_team_portal
      - key: MONGODB_URI
        sync: false # set in the Render dashboard
      - key: CLIENT_URL
        sync: false # the static site's URL, e.g. https://sport-team-portal-web.onrender.com

  # React frontend
  - type: web
    name: sport-team-portal-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # the API's URL + /api, e.g. https://sport-team-portal-api.onrender.com/api
